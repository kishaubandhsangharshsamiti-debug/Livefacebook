<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:transparent;
}

.livefacebook{

display:flex;
align-items:center;

padding:12px 28px;

background:#1877F2;

border-radius:50px;

font-size:28px;

font-family:Arial;

font-weight:bold;

color:white;

text-decoration:none;

box-shadow:0 0 25px #1877F2;

animation:pulse 1s infinite;

}

.dot{

width:18px;

height:18px;

background:white;

border-radius:50%;

margin-right:12px;

animation:blink .8s infinite;

}

@keyframes blink{

0%{opacity:1;}

50%{opacity:0;}

100%{opacity:1;}

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}

</style>

</head>

<body>

<a class="livefacebook"
href="https://www.facebook.com/share/1BhRbEEbuA/"
target="_blank">

<div class="dot"></div>

LIVEfacebook

</a>

</body>

</html>
